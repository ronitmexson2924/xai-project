services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pcg
      POSTGRES_PASSWORD: pcg
      POSTGRES_DB: pcg
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcg"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
