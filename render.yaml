# Render blueprint: the API, its Postgres and a Key Value store (Redis) for rate-limit counters.
# The frontend deploys to Vercel (frontend/vercel.json) with API_URL set to this service's URL and
# PROXY_SECRET set to the value Render generates below. Browsers call only the frontend, which
# forwards API calls, so CORS_ORIGINS can stay empty.
services:
  - type: web
    name: pcg-engine-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install .
    # migrate and load content/ (both idempotent) before serving
    startCommand: >-
      alembic upgrade head && python -m app.graph.seed ../content &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    envVars:
      - key: ENVIRONMENT
        value: production  # refuses to start with a weak JWT secret or CORS "*"
      - key: DATABASE_URL
        fromDatabase:
          name: pcg-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ANALYSIS_SALT  # fixed for the whole study: never regenerate it
        generateValue: true
      - key: PROXY_SECRET  # copy this value to the Vercel project's PROXY_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false  # only for browsers calling the API directly; empty is fine
      - key: TRUST_FORWARDED_FOR
        value: "true"  # Render's proxy sets X-Forwarded-For...
      - key: TRUSTED_PROXY_IPS
        value: "*"  # ...and every request reaches the service through it
      - key: REDIS_URL  # rate limits shared by every instance
        fromService:
          type: keyvalue
          name: pcg-limits
          property: connectionString
      - key: ALLOW_REGISTRATION
        value: "true"  # "false" for the study: accounts come from `python -m app.auth.onboard cohort`
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL_EXPLAIN
        sync: false
      - key: GEMINI_MODEL_OFFLINE
        sync: false
      - key: LLM_TIMEOUT_SECONDS
        value: "4.0"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_REQUESTS_PER_MINUTE
        value: "120"

  - type: keyvalue  # Redis-compatible; counters only, nothing that must survive a restart
    name: pcg-limits
    plan: free
    maxmemoryPolicy: volatile-lru
    ipAllowList: []  # reachable only from this account's services

databases:
  - name: pcg-db
    databaseName: pcg
    user: pcg
    # a paid plan: free Render databases expire after 30 days, and this one holds study data
    plan: basic-256mb
