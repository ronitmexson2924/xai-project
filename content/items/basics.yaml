- id: nested-loops-2
  concept_id: loop-complexity-analysis
  kind: mcq
  stem: "Consider this concrete application of Nested Loops:\n\n```python\nfor i in range(2):\n    for\
    \ j in range(3): print(i, j)\n```\n\nWhat is the fundamental guarantee demonstrated by this trace?"
  options:
  - An inner loop executes its full cycle for every single step of the outer loop.
  - It guarantees random O(1) jump access to any uncomputed state.
  - It eliminates the need for any base state or bounds.
  - It executes an infinite loop that ignores input constraints.
  answer: An inner loop executes its full cycle for every single step of the outer loop.
  difficulty: 2
  distractor_misconceptions: {}
  is_microcheck: false
  review_status: approved
