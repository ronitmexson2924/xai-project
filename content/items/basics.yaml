- id: variables-and-types-p3
  concept_id: variables-and-types
  kind: mcq
  stem: After `a = 7` and then `b = a`, which statement is true?
  options:
  - a and b are both bound to the value 7; rebinding a later leaves b as 7
  - b is permanently tied to a, so b changes whenever a is reassigned
  - b stores the expression 'a', which is re-evaluated every time b is used
  answer: a and b are both bound to the value 7; rebinding a later leaves b as 7
  difficulty: 2
  distractor_misconceptions:
    b is permanently tied to a, so b changes whenever a is reassigned: vars-assignment-links-names
    b stores the expression 'a', which is re-evaluated every time b is used: vars-assignment-links-names
  is_microcheck: false
  review_status: draft
