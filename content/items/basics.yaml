items:
- id: loops-1
  concept_id: loops
  kind: mcq
  stem: Which statement correctly characterizes the core invariant of Loops & Iteration?
  options:
  - Every loop needs a condition that eventually changes state to terminate.
  - It operates without bounds and skips checking the termination condition.
  - It executes in reverse order without updating state.
  - It treats all elements as mutually independent without relationships.
  answer: Every loop needs a condition that eventually changes state to terminate.
  difficulty: 1
  distractor_misconceptions:
    It operates without bounds and skips checking the termination condition.: loops-off-by-one
    It executes in reverse order without updating state.: loops-never-terminate
  is_microcheck: false
  review_status: approved
- id: loops-2
  concept_id: loops
  kind: mcq
  stem: 'Consider this concrete application of Loops & Iteration:


    ```python

    for i in range(3): print(i)

    ```


    What is the fundamental guarantee demonstrated by this trace?'
  options:
  - A loop runs code repeatedly while a termination condition holds.
  - It guarantees random O(1) jump access to any uncomputed state.
  - It eliminates the need for any base state or bounds.
  - It executes an infinite loop that ignores input constraints.
  answer: A loop runs code repeatedly while a termination condition holds.
  difficulty: 1
  distractor_misconceptions:
    It eliminates the need for any base state or bounds.: loops-off-by-one
    It executes an infinite loop that ignores input constraints.: loops-never-terminate
  is_microcheck: false
  review_status: approved
- id: loops-3
  concept_id: loops
  kind: mcq
  stem: When implementing Loops & Iteration, which error represents the most frequent
    pitfall?
  options:
  - 'Off-by-one: range(3) stops before 3.'
  - Using descriptive identifier names for local pointers.
  - Structuring code inside functions rather than flat scripts.
  - Checking preconditions before accessing boundary values.
  answer: 'Off-by-one: range(3) stops before 3.'
  difficulty: 2
  distractor_misconceptions:
    Using descriptive identifier names for local pointers.: loops-off-by-one
    Checking preconditions before accessing boundary values.: loops-never-terminate
  is_microcheck: false
  review_status: approved
