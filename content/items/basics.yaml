- id: nested-loops-1
  concept_id: nested-loops
  kind: mcq
  stem: Which statement correctly characterizes the core invariant of Nested Loops?
  options:
  - 'Total iterations multiply: outer iterations * inner iterations.'
  - It operates without bounds and skips checking the termination condition.
  - It executes in reverse order without updating state.
  - It treats all elements as mutually independent without relationships.
  answer: 'Total iterations multiply: outer iterations * inner iterations.'
  difficulty: 2
  distractor_misconceptions:
    It operates without bounds and skips checking the termination condition.: nested-loops-add-not-mult
    It executes in reverse order without updating state.: nested-loops-add-not-mult
  is_microcheck: false
  review_status: approved
- id: nested-loops-2
  concept_id: nested-loops
  kind: mcq
  stem: "Consider this concrete application of Nested Loops:\n\n```python\nfor i in\
    \ range(2):\n    for j in range(3): print(i, j)\n```\n\nWhat is the fundamental\
    \ guarantee demonstrated by this trace?"
  options:
  - An inner loop executes its full cycle for every single step of the outer loop.
  - It guarantees random O(1) jump access to any uncomputed state.
  - It eliminates the need for any base state or bounds.
  - It executes an infinite loop that ignores input constraints.
  answer: An inner loop executes its full cycle for every single step of the outer
    loop.
  difficulty: 2
  distractor_misconceptions:
    It eliminates the need for any base state or bounds.: nested-loops-add-not-mult
    It executes an infinite loop that ignores input constraints.: nested-loops-add-not-mult
  is_microcheck: false
  review_status: approved
