- id: linked-list-insert-delete-p1
  concept_id: linked-list-insert-delete
  kind: mcq
  stem: |-
    ```python
    class Node:
        def __init__(self, val, next=None):
            self.val, self.next = val, next

    def insert_after(prev, val):
        new = Node(val)
        prev.next = new
        new.next = prev.next

    head = Node(1, Node(2, Node(3)))
    insert_after(head, 9)
    out, node, steps = [], head, 0
    while node is not None and steps < 5:
        out.append(node.val)
        node, steps = node.next, steps + 1
    print(out)
    ```
