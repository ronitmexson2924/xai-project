  - '[1]'
  - '[3, 2, 1]'
  answer: '[1]'
  difficulty: 3
  distractor_misconceptions:
    '[3, 2, 1]': rev-return-old-head
    '[1, 2, 3]': rev-return-old-head
  is_microcheck: false
  review_status: draft
