  - '[1, 9]'
  - '[1, 9, 9, 9, 9]'
  answer: '[1, 9, 9, 9, 9]'
  difficulty: 3
  distractor_misconceptions:
    '[1, 9, 2, 3]': lli-wrong-update-order
    '[1, 9]': lli-wrong-update-order
  is_microcheck: false
  review_status: draft
