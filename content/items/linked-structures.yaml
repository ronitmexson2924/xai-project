  concept_id: doubly-linked-list
  kind: mcq
  stem: 'Consider this concrete application of Doubly Linked Lists:


    ```python

    node.prev.next = node.next; node.next.prev = node.prev

    ```


    What is the fundamental guarantee demonstrated by this trace?'
  options:
  - Nodes store pointers to both predecessor (prev) and successor (next).
  - It guarantees random O(1) jump access to any uncomputed state.
  - It eliminates the need for any base state or bounds.
  - It executes an infinite loop that ignores input constraints.
  answer: Nodes store pointers to both predecessor (prev) and successor (next).
  difficulty: 3
  distractor_misconceptions: {}
  is_microcheck: false
  review_status: approved
