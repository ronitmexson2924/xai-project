  concept_id: stack
  kind: mcq
  stem: |-
    ```python
    def balanced(s):
        pairs = {")": "(", "]": "["}
        stack = []
        for ch in s:
            if ch in "([":
                stack.append(ch)
            elif not stack or stack.pop() != pairs[ch]:
                return False
        return not stack

    print(balanced("([)]"), balanced("[()]"))
    ```
    What does this print?
  options:
  - True True
  - False True
  - IndexError
  answer: False True
  difficulty: 2
  distractor_misconceptions:
