- id: linked-list-insertion-1
  concept_id: linked-list-insert-delete
  kind: mcq
  stem: Which statement correctly characterizes the core invariant of Linked List Insertion?
  options:
  - 'Wiring order matters: link new node to successor first to avoid losing chain.'
  - It operates without bounds and skips checking the termination condition.
  - It executes in reverse order without updating state.
  - It treats all elements as mutually independent without relationships.
  answer: 'Wiring order matters: link new node to successor first to avoid losing chain.'
  difficulty: 2
  distractor_misconceptions: {}
  is_microcheck: false
  review_status: approved
- id: linked-list-insertion-2
  concept_id: linked-list-insert-delete
  kind: mcq
  stem: 'Consider this concrete application of Linked List Insertion:


    ```python

    new_node.next = curr.next; curr.next = new_node

    ```


    What is the fundamental guarantee demonstrated by this trace?'
  options:
  - Insertion updates new_node.next = prev.next, then prev.next = new_node.
  - It guarantees random O(1) jump access to any uncomputed state.
  - It eliminates the need for any base state or bounds.
  - It executes an infinite loop that ignores input constraints.
  answer: Insertion updates new_node.next = prev.next, then prev.next = new_node.
  difficulty: 2
  distractor_misconceptions: {}
  is_microcheck: false
  review_status: approved
- id: linked-list-insertion-3
  concept_id: linked-list-insert-delete
  kind: mcq
  stem: When implementing Linked List Insertion, which error represents the most frequent pitfall?
  options:
  - Overwriting curr.next before linking new_node.next orphans the rest of the list.
  - Using descriptive identifier names for local pointers.
  - Structuring code inside functions rather than flat scripts.
  - Checking preconditions before accessing boundary values.
  answer: Overwriting curr.next before linking new_node.next orphans the rest of the list.
  difficulty: 3
  distractor_misconceptions: {}
  is_microcheck: false
  review_status: approved
