- id: fast-slow-pointers-1
  concept_id: fast-slow-pointers
  kind: mcq
  stem: Which statement correctly characterizes the core invariant of Fast & Slow Pointers (Floyd's Cycle)?
  options:
  - In a cyclic list, the relative distance between fast and slow decreases by 1 each step.
  - It operates without bounds and skips checking the termination condition.
  - It executes in reverse order without updating state.
  - It treats all elements as mutually independent without relationships.
  answer: In a cyclic list, the relative distance between fast and slow decreases by 1 each step.
  difficulty: 3
  distractor_misconceptions: {}
  is_microcheck: false
  review_status: approved
- id: fast-slow-pointers-2
  concept_id: fast-slow-pointers
  kind: mcq
  stem: 'Consider this concrete application of Fast & Slow Pointers (Floyd''s Cycle):


    ```python

    while fast and fast.next: slow = slow.next; fast = fast.next.next; if slow == fast: cycle()

    ```


    What is the fundamental guarantee demonstrated by this trace?'
  options:
  - Slow advances 1 step while fast advances 2 steps per iteration.
  - It guarantees random O(1) jump access to any uncomputed state.
  - It eliminates the need for any base state or bounds.
  - It executes an infinite loop that ignores input constraints.
  answer: Slow advances 1 step while fast advances 2 steps per iteration.
  difficulty: 3
  distractor_misconceptions: {}
  is_microcheck: false
  review_status: approved
- id: fast-slow-pointers-3
  concept_id: fast-slow-pointers
  kind: mcq
  stem: When implementing Fast & Slow Pointers (Floyd's Cycle), which error represents the most frequent
    pitfall?
  options:
  - Failing to check fast.next before accessing fast.next.next.
  - Using descriptive identifier names for local pointers.
  - Structuring code inside functions rather than flat scripts.
  - Checking preconditions before accessing boundary values.
  answer: Failing to check fast.next before accessing fast.next.next.
  difficulty: 4
