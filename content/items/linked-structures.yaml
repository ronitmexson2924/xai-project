- id: linked-list-traversal-1
  concept_id: singly-linked-list
  kind: mcq
  stem: Which statement correctly characterizes the core invariant of Linked List Traversal?
  options:
  - Always verify current is not None before dereferencing current.next.
  - It operates without bounds and skips checking the termination condition.
  - It executes in reverse order without updating state.
  - It treats all elements as mutually independent without relationships.
  answer: Always verify current is not None before dereferencing current.next.
  difficulty: 2
  distractor_misconceptions: {}
  is_microcheck: false
  review_status: approved
- id: linked-list-traversal-2
  concept_id: singly-linked-list
  kind: mcq
  stem: 'Consider this concrete application of Linked List Traversal:


    ```python

    curr = head; while curr: print(curr.val); curr = curr.next

    ```


    What is the fundamental guarantee demonstrated by this trace?'
  options:
  - Traversal steps from current = current.next until current is None.
  - It guarantees random O(1) jump access to any uncomputed state.
  - It eliminates the need for any base state or bounds.
  - It executes an infinite loop that ignores input constraints.
  answer: Traversal steps from current = current.next until current is None.
  difficulty: 2
  distractor_misconceptions: {}
  is_microcheck: false
  review_status: approved
