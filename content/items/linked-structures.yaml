items:
- id: singly-linked-list-node-1
  concept_id: references
  kind: mcq
  stem: Which statement correctly characterizes the core invariant of Singly Linked List Nodes?
  options:
  - Nodes are scattered non-contiguously across memory connected by reference pointers.
  - It operates without bounds and skips checking the termination condition.
  - It executes in reverse order without updating state.
  - It treats all elements as mutually independent without relationships.
  answer: Nodes are scattered non-contiguously across memory connected by reference pointers.
  difficulty: 2
  distractor_misconceptions: {}
  is_microcheck: false
  review_status: approved
- id: singly-linked-list-node-2
  concept_id: references
  kind: mcq
  stem: 'Consider this concrete application of Singly Linked List Nodes:


    ```python

    class Node: val, next = None. head = Node(1); head.next = Node(2)

    ```


    What is the fundamental guarantee demonstrated by this trace?'
  options:
  - A linked list node stores data and a pointer reference to the subsequent node.
  - It guarantees random O(1) jump access to any uncomputed state.
  - It eliminates the need for any base state or bounds.
  - It executes an infinite loop that ignores input constraints.
  answer: A linked list node stores data and a pointer reference to the subsequent node.
  difficulty: 2
  distractor_misconceptions: {}
  is_microcheck: false
  review_status: approved
- id: singly-linked-list-node-3
  concept_id: references
  kind: mcq
  stem: When implementing Singly Linked List Nodes, which error represents the most frequent pitfall?
  options:
  - Assuming node.next is a node instead of checking if it is None.
  - Using descriptive identifier names for local pointers.
  - Structuring code inside functions rather than flat scripts.
  - Checking preconditions before accessing boundary values.
  answer: Assuming node.next is a node instead of checking if it is None.
  difficulty: 3
  distractor_misconceptions: {}
  is_microcheck: false
  review_status: approved
