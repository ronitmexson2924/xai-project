- id: pretest-01
  concept_id: loops
  kind: mcq
  stem: '[Pre-Assessment 1/15] What is the primary guarantee of Loops & Iteration?'
  options:
  - Every loop needs a condition that eventually changes state to terminate.
  - It eliminates all resource constraints and halts in zero steps.
  - It reverses all pointers unconditionally without bounds.
  - It mutates globals outside the local scope arbitrarily.
  answer: Every loop needs a condition that eventually changes state to terminate.
  difficulty: 1
  distractor_misconceptions: {}
  is_microcheck: false
