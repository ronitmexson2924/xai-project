# Draft items for the pretest test (parallel forms: pretest-NN and posttest-NN test the same concept). Every item is review_status: draft until Ronit reviews it
# (S3): set approved or rejected per item. Only approved items are served (GraphSnapshot).
# Each distractor maps to a misconception of the item's own concept (content/misconceptions.yaml).
items:
- id: pretest-01
  concept_id: loops
  kind: mcq
  stem: |-
    ```python
    total = 0
    for i in range(1, 5):
        total += i
    print(total)
    ```
    What does this print?
  options:
  - '10'
  - '15'
  - '14'
  answer: '10'
  difficulty: 1
  distractor_misconceptions:
    '15': loops-off-by-one
    '14': loops-off-by-one
  is_microcheck: false
  review_status: draft
- id: pretest-02
  concept_id: functions
  kind: mcq
  stem: |-
    ```python
    def half(n):
        print(n // 2)

    x = half(10)
    print(x)
    ```
    What is the second line printed?
  options:
  - '5'
  - None
  - '10'
  answer: None
  difficulty: 1
  distractor_misconceptions:
    '5': func-print-is-return
    '10': func-print-is-return
  is_microcheck: false
  review_status: draft
- id: pretest-03
  concept_id: big-o-notation
  kind: mcq
  stem: A function does `5n + 40` steps on an input of size n. What is its Big-O?
  options:
  - O(5n + 40)
  - O(n)
  - O(n), so it always takes n seconds
  answer: O(n)
  difficulty: 2
  distractor_misconceptions:
    O(5n + 40): bigo-keeps-constants
    O(n), so it always takes n seconds: bigo-measures-seconds
  is_microcheck: false
  review_status: draft
- id: pretest-04
  concept_id: arrays-indexing
  kind: mcq
  stem: For `a = [4, 9, 2, 7]`, what is `a[3]`?
  options:
  - '2'
  - '7'
  - IndexError
  answer: '7'
  difficulty: 1
  distractor_misconceptions:
    '2': arr-index-starts-at-one
    IndexError: arr-last-index-is-len
  is_microcheck: false
  review_status: draft
- id: pretest-05
  concept_id: hash-maps
  kind: mcq
  stem: Which of these can be a key in a Python dict?
  options:
  - '''abc'''
  - '[''a'', ''b'', ''c'']'
  - '{''a'': 1}'
  answer: '''abc'''
  difficulty: 2
  distractor_misconceptions:
    '[''a'', ''b'', ''c'']': hash-any-key
    '{''a'': 1}': hash-any-key
  is_microcheck: false
  review_status: draft
- id: pretest-06
  concept_id: references
  kind: mcq
  stem: |-
    ```python
    a = [1]
    b = a
    b.append(2)
    print(a, b)
    ```
    What does this print?
  options:
  - '[1] [2]'
  - '[1] [1, 2]'
  - '[1, 2] [1, 2]'
  answer: '[1, 2] [1, 2]'
  difficulty: 2
  distractor_misconceptions:
    '[1] [1, 2]': ref-assignment-copies
    '[1] [2]': ref-assignment-copies
  is_microcheck: false
  review_status: draft
- id: pretest-07
  concept_id: stack
  kind: mcq
  stem: You push 4, 5, 6 onto an empty stack and pop twice. What comes out, in order?
  options:
  - 5, 4
  - 6, 5
  - 4, 5
  answer: 6, 5
  difficulty: 2
  distractor_misconceptions:
    4, 5: stack-fifo
    5, 4: stack-fifo
  is_microcheck: false
  review_status: draft
- id: pretest-08
  concept_id: queue
  kind: mcq
  stem: You enqueue 4, 5, 6 into an empty queue and dequeue once. What comes out?
  options:
  - '4'
  - '6'
  - '5'
  answer: '4'
  difficulty: 2
  distractor_misconceptions:
    '6': queue-lifo
    '5': queue-lifo
  is_microcheck: false
  review_status: draft
- id: pretest-09
  concept_id: recursion-base-case
  kind: mcq
  stem: |-
    ```python
    def prod(n):
        if n == 1:
            return 0
        return n * prod(n - 1)

    print(prod(3))
    ```
    What does this print?
  options:
  - '6'
  - '3'
  - '0'
  answer: '0'
  difficulty: 2
  distractor_misconceptions:
    '6': rbc-base-case-wrong-value
    '3': rbc-base-case-wrong-value
  is_microcheck: false
  review_status: draft
- id: pretest-10
  concept_id: call-stack
  kind: mcq
  stem: |-
    ```python
    out = []
    def f(n):
        if n == 0:
            return
        f(n - 1)
        out.append(n)

    f(3)
    print(out)
    ```
    What does this print?
  options:
  - '[]'
  - '[3, 3, 3]'
  - '[1, 2, 3]'
  answer: '[1, 2, 3]'
  difficulty: 3
  distractor_misconceptions:
    '[]': cs-code-after-call-skipped
    '[3, 3, 3]': cs-shared-locals
  is_microcheck: false
  review_status: draft
- id: pretest-11
  concept_id: binary-search
  kind: mcq
  stem: About how many comparisons does binary search need on a sorted list of 1,000 elements, in the
    worst case?
  options:
  - About 500
  - About 10
  - About 10, even if the list is unsorted
  answer: About 10
  difficulty: 2
  distractor_misconceptions:
    About 500: bs-linear-time
    About 10, even if the list is unsorted: bs-unsorted-ok
  is_microcheck: false
  review_status: draft
- id: pretest-12
  concept_id: merge-sort
  kind: mcq
  stem: 'Merging the sorted lists [2, 6] and [1, 3, 8, 9]: the main loop stops once [2, 6] is used up.
    What must still be added?'
  options:
  - Nothing
  - '[8, 9]'
  - Nothing, and the merge used O(1) extra memory
  answer: '[8, 9]'
  difficulty: 3
  distractor_misconceptions:
    Nothing: ms-forget-leftovers
    Nothing, and the merge used O(1) extra memory: ms-in-place-free
  is_microcheck: false
  review_status: draft
- id: pretest-13
  concept_id: binary-search-tree
  kind: mcq
  stem: Root 20 has left child 10; 10 has right child 25. Is this a valid BST?
  options:
  - Yes, and search is O(log n)
  - 'Yes: 25 > 10, so each node is ordered with its children'
  - 'No: 25 is in 20''s left subtree'
  answer: 'No: 25 is in 20''s left subtree'
  difficulty: 3
  distractor_misconceptions:
    'Yes: 25 > 10, so each node is ordered with its children': bst-local-check
    Yes, and search is O(log n): bst-always-logn
  is_microcheck: false
  review_status: draft
- id: pretest-14
  concept_id: graph-bfs
  kind: mcq
  stem: Edges s-a (weight 2), a-t (weight 2), s-t (weight 9). Which path to t does BFS from s find first?
  options:
  - s-a-t, the cheapest path
  - s-t, the path with fewest edges
  - s-a-t, because BFS minimises total weight
  answer: s-t, the path with fewest edges
  difficulty: 3
  distractor_misconceptions:
    s-a-t, the cheapest path: bfs-weighted-shortest
    s-a-t, because BFS minimises total weight: bfs-weighted-shortest
  is_microcheck: false
  review_status: draft
- id: pretest-15
  concept_id: memoization
  kind: mcq
  stem: A memoised function creates `cache = {}` as its first line, inside every call. What is the effect?
  options:
  - Results are reused, but only within one level
  - Nothing is reused; it is as slow as plain recursion
  - Every result is reused
  answer: Nothing is reused; it is as slow as plain recursion
  difficulty: 3
  distractor_misconceptions:
    Every result is reused: memo-fresh-cache
    Results are reused, but only within one level: memo-fresh-cache
  is_microcheck: false
  review_status: draft
