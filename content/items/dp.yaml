  concept_id: dp-state-design
  kind: mcq
  stem: |-
    ```python
    def ways(n):
        dp = [0] * (n + 1)
        dp[0] = 1
        for i in range(1, n + 1):
            dp[i] = dp[i - 1] + (dp[i - 2] if i >= 2 else 0)
        return dp[n]

    print(ways(5))
    ```
