- id: overlapping-subproblems-1
  concept_id: overlapping-subproblems
  kind: mcq
  stem: Which statement correctly characterizes the core invariant of Overlapping
    Subproblems?
  options:
  - Caching answers transforms exponential O(2^N) calls into polynomial O(N) operations.
  - It operates without bounds and skips checking the termination condition.
  - It executes in reverse order without updating state.
  - It treats all elements as mutually independent without relationships.
  answer: Caching answers transforms exponential O(2^N) calls into polynomial O(N)
    operations.
  difficulty: 3
  distractor_misconceptions:
    It operates without bounds and skips checking the termination condition.: ovl-dc-is-dp
    It executes in reverse order without updating state.: ovl-dc-is-dp
    It treats all elements as mutually independent without relationships.: ovl-dc-is-dp
  is_microcheck: false
  review_status: approved
- id: overlapping-subproblems-2
  concept_id: overlapping-subproblems
  kind: mcq
  stem: 'Consider this concrete application of Overlapping Subproblems:


    ```python

    In fib(5), fib(3) is computed twice independently without memoization.

    ```


    What is the fundamental guarantee demonstrated by this trace?'
  options:
  - A problem exhibits overlapping subproblems if a recursive solution revisits identical
    states.
  - It guarantees random O(1) jump access to any uncomputed state.
  - It eliminates the need for any base state or bounds.
  - It executes an infinite loop that ignores input constraints.
  answer: A problem exhibits overlapping subproblems if a recursive solution revisits
    identical states.
  difficulty: 3
  distractor_misconceptions:
    It guarantees random O(1) jump access to any uncomputed state.: ovl-dc-is-dp
    It eliminates the need for any base state or bounds.: ovl-dc-is-dp
    It executes an infinite loop that ignores input constraints.: ovl-dc-is-dp
  is_microcheck: false
  review_status: approved
- id: overlapping-subproblems-3
  concept_id: overlapping-subproblems
  kind: mcq
  stem: When implementing Overlapping Subproblems, which error represents the most
    frequent pitfall?
  options:
  - Using DP when subproblems do not overlap (e.g. merge sort sub-arrays are distinct).
  - Using descriptive identifier names for local pointers.
  - Structuring code inside functions rather than flat scripts.
  - Checking preconditions before accessing boundary values.
  answer: Using DP when subproblems do not overlap (e.g. merge sort sub-arrays are
    distinct).
  difficulty: 4
  distractor_misconceptions:
    Using descriptive identifier names for local pointers.: ovl-dc-is-dp
    Structuring code inside functions rather than flat scripts.: ovl-dc-is-dp
    Checking preconditions before accessing boundary values.: ovl-dc-is-dp
  is_microcheck: false
  review_status: approved
