- id: memoization-p1
  concept_id: memoization
  kind: mcq
  stem: |-
    ```python
    calls = 0
    def fib(n):
        global calls
        calls += 1
        memo = {}
        if n < 2:
            return n
        if n not in memo:
            memo[n] = fib(n - 1) + fib(n - 2)
        return memo[n]

    fib(6)
    print(calls)
    ```
    What does this print?
  options:
  - '11'
  - '25'
  - '7'
  answer: '25'
  difficulty: 3
