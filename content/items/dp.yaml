- id: optimal-substructure-1
  concept_id: dp-state-design
  kind: mcq
  stem: Which statement correctly characterizes the core invariant of Optimal Substructure?
  options:
  - Shortest path from A to C via B requires optimal shortest path from A to B and
    B to C.
  - It operates without bounds and skips checking the termination condition.
  - It executes in reverse order without updating state.
  - It treats all elements as mutually independent without relationships.
  answer: Shortest path from A to C via B requires optimal shortest path from A to
    B and B to C.
  difficulty: 3
  distractor_misconceptions:
    It operates without bounds and skips checking the termination condition.: dps-vague-state
    It executes in reverse order without updating state.: dps-vague-state
    It treats all elements as mutually independent without relationships.: dps-vague-state
