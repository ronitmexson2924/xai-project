- id: memoization-top-down-1
  concept_id: memoization
  kind: mcq
  stem: Which statement correctly characterizes the core invariant of Top-Down DP
    (Memoization)?
  options:
  - Check memo table before computing; store result before returning.
  - It operates without bounds and skips checking the termination condition.
  - It executes in reverse order without updating state.
  - It treats all elements as mutually independent without relationships.
  answer: Check memo table before computing; store result before returning.
  difficulty: 3
  distractor_misconceptions:
    It operates without bounds and skips checking the termination condition.: memo-fresh-cache
    It executes in reverse order without updating state.: memo-mutable-default
    It treats all elements as mutually independent without relationships.: memo-fresh-cache
  is_microcheck: false
  review_status: approved
- id: memoization-top-down-2
  concept_id: memoization
  kind: mcq
  stem: 'Consider this concrete application of Top-Down DP (Memoization):


    ```python

    if n in memo: return memo[n]; memo[n] = solve(n-1) + solve(n-2); return memo[n]

    ```


    What is the fundamental guarantee demonstrated by this trace?'
  options:
  - Top-down DP preserves natural recursive flow but intercepts calls to check a memo
    table.
  - It guarantees random O(1) jump access to any uncomputed state.
  - It eliminates the need for any base state or bounds.
  - It executes an infinite loop that ignores input constraints.
  answer: Top-down DP preserves natural recursive flow but intercepts calls to check
    a memo table.
  difficulty: 3
  distractor_misconceptions:
    It guarantees random O(1) jump access to any uncomputed state.: memo-fresh-cache
    It eliminates the need for any base state or bounds.: memo-mutable-default
    It executes an infinite loop that ignores input constraints.: memo-fresh-cache
  is_microcheck: false
  review_status: approved
