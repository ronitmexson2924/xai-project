- id: tabulation-bottom-up-1
  concept_id: tabulation
  kind: mcq
  stem: Which statement correctly characterizes the core invariant of Bottom-Up DP
    (Tabulation)?
  options:
  - Eliminates recursion call stack overhead and allows space optimization.
  - It operates without bounds and skips checking the termination condition.
  - It executes in reverse order without updating state.
  - It treats all elements as mutually independent without relationships.
  answer: Eliminates recursion call stack overhead and allows space optimization.
  difficulty: 3
  distractor_misconceptions:
    It operates without bounds and skips checking the termination condition.: tab-wrong-order
    It executes in reverse order without updating state.: tab-wrong-order
    It treats all elements as mutually independent without relationships.: tab-wrong-order
  is_microcheck: false
  review_status: approved
- id: tabulation-bottom-up-2
  concept_id: tabulation
  kind: mcq
  stem: 'Consider this concrete application of Bottom-Up DP (Tabulation):


    ```python

    dp = [0] * (n + 1); dp[1] = 1; for i in range(2, n + 1): dp[i] = dp[i-1] + dp[i-2]

    ```


    What is the fundamental guarantee demonstrated by this trace?'
  options:
  - Bottom-up DP fills a table iteratively starting from base cases up to target state.
  - It guarantees random O(1) jump access to any uncomputed state.
  - It eliminates the need for any base state or bounds.
  - It executes an infinite loop that ignores input constraints.
  answer: Bottom-up DP fills a table iteratively starting from base cases up to target
    state.
  difficulty: 3
  distractor_misconceptions:
    It guarantees random O(1) jump access to any uncomputed state.: tab-wrong-order
    It eliminates the need for any base state or bounds.: tab-wrong-order
    It executes an infinite loop that ignores input constraints.: tab-wrong-order
  is_microcheck: false
  review_status: approved
- id: tabulation-bottom-up-3
  concept_id: tabulation
  kind: mcq
  stem: When implementing Bottom-Up DP (Tabulation), which error represents the most
    frequent pitfall?
  options:
  - Iterating in an order where required predecessor states are not yet computed.
  - Using descriptive identifier names for local pointers.
  - Structuring code inside functions rather than flat scripts.
  - Checking preconditions before accessing boundary values.
  answer: Iterating in an order where required predecessor states are not yet computed.
