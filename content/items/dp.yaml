- id: knapsack-01-p1
  concept_id: knapsack-01
  kind: mcq
  stem: |-
    ```python
    def knapsack(items, W, downwards=True):
        dp = [0] * (W + 1)
        for weight, value in items:
            ws = range(W, weight - 1, -1) if downwards else range(weight, W + 1)
            for w in ws:
                dp[w] = max(dp[w], dp[w - weight] + value)
        return dp[W]

    print(knapsack([(2, 3)], 6, downwards=False))
    ```
    What does this print?
  options:
  - '6'
  - '9'
  - '3'
  answer: '9'
  difficulty: 4
  distractor_misconceptions:
    '3': ks-upward-loop
    '6': ks-upward-loop
  is_microcheck: false
  review_status: draft
