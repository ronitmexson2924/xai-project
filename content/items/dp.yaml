- id: lcs-p2
  concept_id: lcs
  kind: mcq
  stem: |-
    ```python
    def lcs(a, b):
        m, n = len(a), len(b)
        dp = [[0] * (n + 1) for _ in range(m + 1)]
        for i in range(1, m + 1):
            for j in range(1, n + 1):
                if a[i - 1] == b[j - 1]:
                    dp[i][j] = dp[i - 1][j - 1] + 1
                else:
                    dp[i][j] = max(dp[i - 1][j], dp[i][j - 1])
        return dp[m][n]

    print(lcs("AXBYC", "ABC"))
    ```
    What does this print?
  options:
  - '1'
  - '3'
  - '2'
  answer: '3'
  difficulty: 4
  distractor_misconceptions:
    '1': lcs-substring
    '2': lcs-substring
  is_microcheck: false
  review_status: draft
