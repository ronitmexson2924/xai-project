items:
- id: posttest-01
  concept_id: loops
  kind: mcq
  stem: '[Post-Assessment 1/15] Which invariant holds during the execution of Loops & Iteration?'
  options:
  - A loop runs code repeatedly while a termination condition holds.
  - It eliminates all resource constraints and halts in zero steps.
  - It reverses all pointers unconditionally without bounds.
  - It executes without any state transition or condition check.
  answer: A loop runs code repeatedly while a termination condition holds.
  difficulty: 1
  distractor_misconceptions: {}
  is_microcheck: false
  review_status: approved
