- id: tree-level-order-p2
  concept_id: tree-level-order
  kind: mcq
  stem: |-
    ```python
    class BNode:
        def __init__(self, val, left=None, right=None):
            self.val, self.left, self.right = val, left, right

    def order(root):
        out, todo = [], [root]
        while todo:
            node = todo.pop()
            out.append(node.val)
            for child in (node.left, node.right):
                if child is not None:
                    todo.append(child)
        return out

    print(order(BNode(1, BNode(2, BNode(4)), BNode(3))))
    ```
    What does this print?
