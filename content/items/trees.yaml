- id: tree-height-depth-2
  concept_id: tree-height-depth
  kind: mcq
  stem: 'Consider this concrete application of Tree Height vs Depth:


    ```python

    height(node) = 1 + max(height(node.left), height(node.right))

    ```


    What is the fundamental guarantee demonstrated by this trace?'
  options:
  - Depth is edges from root down to node; height is edges from node down to deepest
    leaf.
  - It guarantees random O(1) jump access to any uncomputed state.
  - It eliminates the need for any base state or bounds.
  - It executes an infinite loop that ignores input constraints.
  answer: Depth is edges from root down to node; height is edges from node down to
    deepest leaf.
  difficulty: 2
