- id: binary-tree-traversal-preorder-1
  concept_id: binary-tree-traversal-preorder
  kind: mcq
  stem: 'Which statement correctly characterizes the core invariant of Binary Tree:
    Preorder Traversal?'
  options:
  - Useful for serializing or cloning tree hierarchies.
  - It operates without bounds and skips checking the termination condition.
  - It executes in reverse order without updating state.
  - It treats all elements as mutually independent without relationships.
  answer: Useful for serializing or cloning tree hierarchies.
  difficulty: 2
  distractor_misconceptions:
    It operates without bounds and skips checking the termination condition.: preorder-processes-leaves-first
    It executes in reverse order without updating state.: preorder-processes-leaves-first
  is_microcheck: false
  review_status: approved
- id: binary-tree-traversal-preorder-2
  concept_id: binary-tree-traversal-preorder
  kind: mcq
  stem: 'Consider this concrete application of Binary Tree: Preorder Traversal:


    ```python

    visit(node); preorder(node.left); preorder(node.right)

    ```


    What is the fundamental guarantee demonstrated by this trace?'
  options:
  - Preorder processes the current node before traversing left and right subtrees.
  - It guarantees random O(1) jump access to any uncomputed state.
  - It eliminates the need for any base state or bounds.
  - It executes an infinite loop that ignores input constraints.
  answer: Preorder processes the current node before traversing left and right subtrees.
  difficulty: 2
  distractor_misconceptions:
    It eliminates the need for any base state or bounds.: preorder-processes-leaves-first
    It executes an infinite loop that ignores input constraints.: preorder-processes-leaves-first
  is_microcheck: false
  review_status: approved
