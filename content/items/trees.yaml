- id: bst-insert-delete-p3
  concept_id: bst-insert-delete
  kind: mcq
  stem: |-
    ```python
    class BNode:
        def __init__(self, val, left=None, right=None):
            self.val, self.left, self.right = val, left, right

    def insert(node, key):
        if node is None:
            return BNode(key)
        if key < node.val:
            node.left = insert(node.left, key)
        elif key > node.val:
            node.right = insert(node.right, key)
        return node

    def inorder(node):
        return [] if node is None else inorder(node.left) + [node.val] + inorder(node.right)

    root = None
    for k in [5, 2, 8, 6]:
        root = insert(root, k)
    print(inorder(root))
    ```
    What does this print?
  options:
  - '[2, 5, 6, 8]'
  - '[2, 5, 8, 6]'
  - '[5, 2, 8, 6]'
  answer: '[2, 5, 6, 8]'
  difficulty: 4
  distractor_misconceptions:
    '[5, 2, 8, 6]': bstd-two-children-delete
    '[2, 5, 8, 6]': bstd-two-children-delete
  is_microcheck: false
  review_status: draft
