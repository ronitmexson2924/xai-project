- id: bst-search-property-2
  concept_id: bst-search-property
  kind: mcq
  stem: 'Consider this concrete application of BST Search Property:


    ```python

    if target < node.val: go left; elif target > node.val: go right.

    ```


    What is the fundamental guarantee demonstrated by this trace?'
  options:
  - 'Every node satisfies: max(left_subtree) < node.val < min(right_subtree).'
  - It guarantees random O(1) jump access to any uncomputed state.
  - It eliminates the need for any base state or bounds.
  - It executes an infinite loop that ignores input constraints.
  answer: 'Every node satisfies: max(left_subtree) < node.val < min(right_subtree).'
