- id: in-place-array-modification-1
  concept_id: array-traversal
  kind: mcq
  stem: Which statement correctly characterizes the core invariant of In-Place Array Modification?
  options:
  - Maintain write_index <= read_index so unprocessed data is never overwritten.
  - It operates without bounds and skips checking the termination condition.
  - It executes in reverse order without updating state.
  - It treats all elements as mutually independent without relationships.
  answer: Maintain write_index <= read_index so unprocessed data is never overwritten.
  difficulty: 2
  distractor_misconceptions: {}
  is_microcheck: false
  review_status: approved
- id: in-place-array-modification-2
  concept_id: array-traversal
  kind: mcq
  stem: 'Consider this concrete application of In-Place Array Modification:


    ```python

    if arr[read] != val: arr[write] = arr[read]; write += 1.

    ```


    What is the fundamental guarantee demonstrated by this trace?'
  options:
  - In-place modification overwrites valid elements using read and write pointer indices.
  - It guarantees random O(1) jump access to any uncomputed state.
  - It eliminates the need for any base state or bounds.
  - It executes an infinite loop that ignores input constraints.
  answer: In-place modification overwrites valid elements using read and write pointer indices.
  difficulty: 2
  distractor_misconceptions: {}
  is_microcheck: false
  review_status: approved
- id: in-place-array-modification-3
  concept_id: array-traversal
  kind: mcq
  stem: When implementing In-Place Array Modification, which error represents the most frequent pitfall?
  options:
  - Overwriting elements before their values have been inspected.
  - Using descriptive identifier names for local pointers.
  - Structuring code inside functions rather than flat scripts.
  - Checking preconditions before accessing boundary values.
  answer: Overwriting elements before their values have been inspected.
  difficulty: 3
  distractor_misconceptions: {}
  is_microcheck: false
  review_status: approved
