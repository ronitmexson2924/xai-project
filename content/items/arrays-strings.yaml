- id: prefix-sums-2
  concept_id: prefix-sums
  kind: mcq
  stem: 'Consider this concrete application of Prefix Sums:


    ```python

    P = [0, 2, 5, 9]; sum(1..2) = P[3] - P[1] = 9 - 2 = 7.

    ```


    What is the fundamental guarantee demonstrated by this trace?'
  options:
  - prefix[i] stores the sum of all elements from index 0 up to i.
  - It guarantees random O(1) jump access to any uncomputed state.
  - It eliminates the need for any base state or bounds.
  - It executes an infinite loop that ignores input constraints.
  answer: prefix[i] stores the sum of all elements from index 0 up to i.
