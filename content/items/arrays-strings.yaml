items:
- id: array-indexing-1
  concept_id: arrays-indexing
  kind: mcq
  stem: Which statement correctly characterizes the core invariant of Array Indexing
    & Bounds?
  options:
  - Index arithmetic calculates memory offset in O(1) time.
  - It operates without bounds and skips checking the termination condition.
  - It executes in reverse order without updating state.
  - It treats all elements as mutually independent without relationships.
  answer: Index arithmetic calculates memory offset in O(1) time.
  difficulty: 1
  distractor_misconceptions:
    It operates without bounds and skips checking the termination condition.: arr-last-index-is-len
    It executes in reverse order without updating state.: arr-index-starts-at-one
    It treats all elements as mutually independent without relationships.: arr-last-index-is-len
  is_microcheck: false
  review_status: approved
- id: array-indexing-2
  concept_id: arrays-indexing
  kind: mcq
  stem: 'Consider this concrete application of Array Indexing & Bounds:


    ```python

    arr[0] gets first element; arr[len(arr)-1] gets last.

    ```


    What is the fundamental guarantee demonstrated by this trace?'
  options:
  - Arrays store elements sequentially in contiguous memory blocks.
  - It guarantees random O(1) jump access to any uncomputed state.
  - It eliminates the need for any base state or bounds.
  - It executes an infinite loop that ignores input constraints.
  answer: Arrays store elements sequentially in contiguous memory blocks.
  difficulty: 1
  distractor_misconceptions:
    It guarantees random O(1) jump access to any uncomputed state.: arr-last-index-is-len
    It eliminates the need for any base state or bounds.: arr-index-starts-at-one
    It executes an infinite loop that ignores input constraints.: arr-last-index-is-len
  is_microcheck: false
  review_status: approved
- id: array-indexing-3
  concept_id: arrays-indexing
  kind: mcq
  stem: When implementing Array Indexing & Bounds, which error represents the most
    frequent pitfall?
  options:
  - Accessing index len(arr) raises IndexError.
  - Using descriptive identifier names for local pointers.
  - Structuring code inside functions rather than flat scripts.
  - Checking preconditions before accessing boundary values.
  answer: Accessing index len(arr) raises IndexError.
  difficulty: 2
  distractor_misconceptions:
    Using descriptive identifier names for local pointers.: arr-last-index-is-len
    Structuring code inside functions rather than flat scripts.: arr-index-starts-at-one
    Checking preconditions before accessing boundary values.: arr-last-index-is-len
  is_microcheck: false
  review_status: approved
