- id: sliding-window-p1
  concept_id: sliding-window
  kind: mcq
  stem: |-
    ```python
    def best(a, k):
        top = 0
        for i in range(len(a) - k + 1):
            top = max(top, sum(a[i:i + k]))
        return top
    ```
    What is the time complexity of best for a list of length n and window size k?
  options:
  - O(n), because it is a sliding window
  - O(k)
  - O(n * k)
  answer: O(n * k)
  difficulty: 2
  distractor_misconceptions:
    O(n), because it is a sliding window: sw-recompute-window
    O(k): sw-recompute-window
  is_microcheck: false
  review_status: draft
- id: sliding-window-p2
  concept_id: sliding-window
  kind: mcq
  stem: When a fixed-size window over `a` slides one step right to end at index `right`, how should the
    window sum be updated?
  options:
  - window = sum(a[:right + 1])
  - window += a[right] - a[right - k]
  - window = sum(a[right - k + 1:right + 1])
  answer: window += a[right] - a[right - k]
  difficulty: 3
  distractor_misconceptions:
    window = sum(a[right - k + 1:right + 1]): sw-recompute-window
    window = sum(a[:right + 1]): sw-recompute-window
  is_microcheck: false
  review_status: draft
- id: sliding-window-p3
  concept_id: sliding-window
  kind: mcq
  stem: |-
    ```python
    def max_window_sum(a, k):
        window = sum(a[:k])
        best = window
        for right in range(k, len(a)):
            window += a[right] - a[right - k]
            best = max(best, window)
        return best

    print(max_window_sum([4, 2, 1, 7, 3], 2))
    ```
    What does this print?
  options:
  - '13'
  - '10'
  - '8'
  answer: '10'
  difficulty: 3
  distractor_misconceptions:
    '8': sw-recompute-window
    '13': sw-recompute-window
  is_microcheck: false
  review_status: draft
