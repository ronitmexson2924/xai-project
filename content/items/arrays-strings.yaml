- id: prefix-sums-1
  concept_id: prefix-sums
  kind: mcq
  stem: Which statement correctly characterizes the core invariant of Prefix Sums?
  options:
  - Range sum query [L, R] = prefix[R] - prefix[L - 1].
  - It operates without bounds and skips checking the termination condition.
  - It executes in reverse order without updating state.
  - It treats all elements as mutually independent without relationships.
  answer: Range sum query [L, R] = prefix[R] - prefix[L - 1].
  difficulty: 2
  distractor_misconceptions: {}
  is_microcheck: false
  review_status: approved
- id: prefix-sums-2
  concept_id: prefix-sums
  kind: mcq
  stem: 'Consider this concrete application of Prefix Sums:


    ```python

    P = [0, 2, 5, 9]; sum(1..2) = P[3] - P[1] = 9 - 2 = 7.

    ```


    What is the fundamental guarantee demonstrated by this trace?'
  options:
  - prefix[i] stores the sum of all elements from index 0 up to i.
  - It guarantees random O(1) jump access to any uncomputed state.
  - It eliminates the need for any base state or bounds.
  - It executes an infinite loop that ignores input constraints.
  answer: prefix[i] stores the sum of all elements from index 0 up to i.
  difficulty: 2
  distractor_misconceptions: {}
  is_microcheck: false
  review_status: approved
