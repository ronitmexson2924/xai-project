- id: sliding-window-1
  concept_id: sliding-window
  kind: mcq
  stem: Which statement correctly characterizes the core invariant of Sliding Window?
  options:
  - Reuses computation from overlapping subsegments to avoid O(N^2) recalculations.
  - It operates without bounds and skips checking the termination condition.
  - It executes in reverse order without updating state.
  - It treats all elements as mutually independent without relationships.
  answer: Reuses computation from overlapping subsegments to avoid O(N^2) recalculations.
  difficulty: 3
  distractor_misconceptions:
    It operates without bounds and skips checking the termination condition.: sw-recompute-window
    It executes in reverse order without updating state.: sw-recompute-window
    It treats all elements as mutually independent without relationships.: sw-recompute-window
  is_microcheck: false
  review_status: approved
- id: sliding-window-2
  concept_id: sliding-window
  kind: mcq
  stem: 'Consider this concrete application of Sliding Window:


    ```python

    Add arr[right] to sum; while sum > target: subtract arr[left]; left += 1.

    ```


    What is the fundamental guarantee demonstrated by this trace?'
  options:
  - A sliding window maintains a contiguous subsegment by expanding right and shrinking
    left.
  - It guarantees random O(1) jump access to any uncomputed state.
  - It eliminates the need for any base state or bounds.
  - It executes an infinite loop that ignores input constraints.
  answer: A sliding window maintains a contiguous subsegment by expanding right and
    shrinking left.
  difficulty: 3
  distractor_misconceptions:
    It guarantees random O(1) jump access to any uncomputed state.: sw-recompute-window
    It eliminates the need for any base state or bounds.: sw-recompute-window
    It executes an infinite loop that ignores input constraints.: sw-recompute-window
  is_microcheck: false
  review_status: approved
