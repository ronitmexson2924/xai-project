- id: two-pointers-p2
  concept_id: two-pointers
  kind: mcq
  stem: |-
    ```python
    def pair_with_sum(a, target):
        i, j = 0, len(a) - 1
        while i < j:
            s = a[i] + a[j]
            if s == target:
                return (a[i], a[j])
            if s < target:
                i += 1
            else:
                j -= 1
        return None

    print(pair_with_sum([5, 1, 8, 3], 9))
    ```
    What does this print?
  options:
  - None
  - (1, 8)
  - (5, 3)
  answer: None
  difficulty: 3
  distractor_misconceptions:
    (1, 8): tp-works-unsorted
    (5, 3): tp-works-unsorted
  is_microcheck: false
  review_status: draft
- id: two-pointers-p3
  concept_id: two-pointers
  kind: mcq
  stem: In the pair-sum scan on a sorted array, why may `i` move right when `a[i] + a[j] < target`?
  options:
  - a[j] is the largest remaining value, so no remaining partner can make a[i] reach the target
  - Because a[i] is always the smallest value, whether or not the array is sorted
  - Moving i is safe on any array, because every pair is checked eventually
  answer: a[j] is the largest remaining value, so no remaining partner can make a[i] reach the target
  difficulty: 3
  distractor_misconceptions:
    Moving i is safe on any array, because every pair is checked eventually: tp-works-unsorted
    Because a[i] is always the smallest value, whether or not the array is sorted: tp-works-unsorted
  is_microcheck: false
  review_status: draft
