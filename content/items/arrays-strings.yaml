  options:
  - In-place modification overwrites valid elements using read and write pointer indices.
  - It guarantees random O(1) jump access to any uncomputed state.
  - It eliminates the need for any base state or bounds.
  - It executes an infinite loop that ignores input constraints.
  answer: In-place modification overwrites valid elements using read and write pointer
