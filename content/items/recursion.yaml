items:
- id: recursion-base-case-1
  concept_id: recursion-base-case
  kind: mcq
  stem: 'Which statement correctly characterizes the core invariant of Recursion:
    Base Case?'
  options:
  - Each recursive step must strictly reduce the problem size towards a base case.
  - It operates without bounds and skips checking the termination condition.
  - It executes in reverse order without updating state.
  - It treats all elements as mutually independent without relationships.
  answer: Each recursive step must strictly reduce the problem size towards a base
    case.
  difficulty: 2
  distractor_misconceptions:
    It operates without bounds and skips checking the termination condition.: recursion-no-base-case
    It executes in reverse order without updating state.: rbc-unreachable-base
    It treats all elements as mutually independent without relationships.: rbc-base-case-wrong-value
  is_microcheck: false
  review_status: approved
- id: recursion-base-case-2
  concept_id: recursion-base-case
  kind: mcq
  stem: 'Consider this concrete application of Recursion: Base Case:


    ```python

    def fact(n): return 1 if n == 0 else n * fact(n - 1)

    ```


    What is the fundamental guarantee demonstrated by this trace?'
  options:
  - A base case is a direct input condition answered without further recursive calls.
  - It guarantees random O(1) jump access to any uncomputed state.
  - It eliminates the need for any base state or bounds.
  - It executes an infinite loop that ignores input constraints.
  answer: A base case is a direct input condition answered without further recursive
    calls.
  difficulty: 2
  distractor_misconceptions:
    It guarantees random O(1) jump access to any uncomputed state.: recursion-no-base-case
    It eliminates the need for any base state or bounds.: rbc-unreachable-base
    It executes an infinite loop that ignores input constraints.: rbc-base-case-wrong-value
  is_microcheck: false
  review_status: approved
- id: recursion-base-case-3
  concept_id: recursion-base-case
  kind: mcq
  stem: 'When implementing Recursion: Base Case, which error represents the most frequent
    pitfall?'
  options:
  - Missing or unreachable base case triggers RecursionError (stack overflow).
  - Using descriptive identifier names for local pointers.
  - Structuring code inside functions rather than flat scripts.
  - Checking preconditions before accessing boundary values.
  answer: Missing or unreachable base case triggers RecursionError (stack overflow).
  difficulty: 3
  distractor_misconceptions:
    Using descriptive identifier names for local pointers.: recursion-no-base-case
    Structuring code inside functions rather than flat scripts.: rbc-unreachable-base
    Checking preconditions before accessing boundary values.: rbc-base-case-wrong-value
  is_microcheck: false
  review_status: approved
