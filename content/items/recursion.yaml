- id: backtracking-basics-1
  concept_id: backtracking
  kind: mcq
  stem: Which statement correctly characterizes the core invariant of Backtracking
    Exploration?
  options:
  - Always revert the state change after the recursive call returns.
  - It operates without bounds and skips checking the termination condition.
  - It executes in reverse order without updating state.
  - It treats all elements as mutually independent without relationships.
  answer: Always revert the state change after the recursive call returns.
  difficulty: 4
  distractor_misconceptions:
    It operates without bounds and skips checking the termination condition.: bt-missing-unchoose
    It executes in reverse order without updating state.: bt-store-reference
    It treats all elements as mutually independent without relationships.: bt-missing-unchoose
  is_microcheck: false
  review_status: approved
- id: backtracking-basics-2
  concept_id: backtracking
  kind: mcq
  stem: 'Consider this concrete application of Backtracking Exploration:


    ```python

    path.append(choice); backtrack(next); path.pop()  # undo choice

    ```


    What is the fundamental guarantee demonstrated by this trace?'
  options:
  - Backtracking builds candidates incrementally and abandons (backtracks) invalid
    paths.
  - It guarantees random O(1) jump access to any uncomputed state.
  - It eliminates the need for any base state or bounds.
  - It executes an infinite loop that ignores input constraints.
  answer: Backtracking builds candidates incrementally and abandons (backtracks) invalid
    paths.
  difficulty: 4
  distractor_misconceptions:
