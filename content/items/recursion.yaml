- id: tree-recursion-1
  concept_id: recursion-tracing
  kind: mcq
  stem: Which statement correctly characterizes the core invariant of Tree & Branching
    Recursion?
  options:
  - Total calls grow exponentially O(b^d) unless subproblems are pruned.
  - It operates without bounds and skips checking the termination condition.
  - It executes in reverse order without updating state.
  - It treats all elements as mutually independent without relationships.
  answer: Total calls grow exponentially O(b^d) unless subproblems are pruned.
  difficulty: 3
  distractor_misconceptions:
    It operates without bounds and skips checking the termination condition.: trace-depth-is-cost
    It executes in reverse order without updating state.: trace-top-down-values
    It treats all elements as mutually independent without relationships.: trace-depth-is-cost
  is_microcheck: false
  review_status: approved
- id: tree-recursion-2
  concept_id: recursion-tracing
  kind: mcq
  stem: 'Consider this concrete application of Tree & Branching Recursion:


    ```python

    fib(n) = fib(n - 1) + fib(n - 2) spawns 2^n operations without cache.

    ```


    What is the fundamental guarantee demonstrated by this trace?'
  options:
  - Branching recursion calls self multiple times, forming an execution tree.
  - It guarantees random O(1) jump access to any uncomputed state.
  - It eliminates the need for any base state or bounds.
  - It executes an infinite loop that ignores input constraints.
  answer: Branching recursion calls self multiple times, forming an execution tree.
  difficulty: 3
  distractor_misconceptions:
    It guarantees random O(1) jump access to any uncomputed state.: trace-depth-is-cost
    It eliminates the need for any base state or bounds.: trace-top-down-values
    It executes an infinite loop that ignores input constraints.: trace-depth-is-cost
  is_microcheck: false
  review_status: approved
