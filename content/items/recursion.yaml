- id: backtracking-p1
  concept_id: backtracking
  kind: mcq
  stem: |-
    ```python
    def subsets(items):
        result, current = [], []
        def explore(i):
            if i == len(items):
                result.append(current)
                return
            current.append(items[i])
            explore(i + 1)
            current.pop()
            explore(i + 1)
        explore(0)
        return result

    print(subsets([1, 2]))
    ```
    What does this print?
  options:
  - '[[1, 2], [1], [2], []]'
  - '[[], [], [], []]'
  - '[[1, 2]]'
  answer: '[[], [], [], []]'
  difficulty: 4
  distractor_misconceptions:
    '[[1, 2], [1], [2], []]': bt-store-reference
    '[[1, 2]]': bt-store-reference
  is_microcheck: false
  review_status: draft
- id: backtracking-p2
  concept_id: backtracking
  kind: mcq
  stem: |-
    ```python
    def subsets(items):
        result, current = [], []
        def explore(i):
            if i == len(items):
                result.append(current.copy())
                return
            current.append(items[i])
            explore(i + 1)
            explore(i + 1)
        explore(0)
        return result

    print(subsets([1, 2]))
    ```
    What does this print?
  options:
  - '[[1, 2], [1, 2], [1, 2, 2], [1, 2, 2]]'
  - '[[1, 2], [1], [2], []]'
  - '[[1, 2], [1]]'
  answer: '[[1, 2], [1, 2], [1, 2, 2], [1, 2, 2]]'
  difficulty: 4
  distractor_misconceptions:
    '[[1, 2], [1], [2], []]': bt-missing-unchoose
    '[[1, 2], [1]]': bt-missing-unchoose
  is_microcheck: false
  review_status: draft
