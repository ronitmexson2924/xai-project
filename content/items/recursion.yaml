- id: call-stack-p1
  concept_id: call-stack
  kind: mcq
  stem: |-
    ```python
    out = []
    def countdown(n):
        if n == 0:
            return
        out.append(n)
        countdown(n - 1)
        out.append(-n)

    countdown(2)
    print(out)
    ```
    What does this print?
  options:
  - '[2, 1, -2, -1]'
  - '[2, 1]'
  - '[2, 1, -1, -2]'
  answer: '[2, 1, -1, -2]'
  difficulty: 3
  distractor_misconceptions:
    '[2, 1]': cs-code-after-call-skipped
    '[2, 1, -2, -1]': cs-shared-locals
  is_microcheck: false
  review_status: draft
