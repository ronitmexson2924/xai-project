- id: tail-recursion-2
  concept_id: recursion-vs-iteration
  kind: mcq
  stem: 'Consider this concrete application of Tail Call Recursion:


    ```python

    def fact_tail(n, acc=1): return acc if n==0 else fact_tail(n-1, n*acc)

    ```


    What is the fundamental guarantee demonstrated by this trace?'
  options:
  - A tail-recursive call has no pending computations after the call returns.
  - It guarantees random O(1) jump access to any uncomputed state.
  - It eliminates the need for any base state or bounds.
  - It executes an infinite loop that ignores input constraints.
  answer: A tail-recursive call has no pending computations after the call returns.
  difficulty: 3
  distractor_misconceptions:
    It guarantees random O(1) jump access to any uncomputed state.: rvi-recursion-faster
    It eliminates the need for any base state or bounds.: rvi-no-depth-limit
    It executes an infinite loop that ignores input constraints.: rvi-recursion-faster
  is_microcheck: false
  review_status: approved
