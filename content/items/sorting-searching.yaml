- id: elementary-sorts-p2
  concept_id: elementary-sorts
  kind: mcq
  stem: |-
    ```python
    def insertion_sort(a):
        shifts = 0
        for i in range(1, len(a)):
            key = a[i]
            j = i - 1
            while j >= 0 and a[j] > key:
                a[j + 1] = a[j]
                shifts += 1
                j -= 1
            a[j + 1] = key
        return shifts

    print(insertion_sort([1, 2, 3, 4, 5]))
    ```
