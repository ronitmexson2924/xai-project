- id: counting-sort-p2
  concept_id: counting-sort
  kind: mcq
  stem: |-
    ```python
    def counting_sort(a, k):
        counts = [0] * (k + 1)
        for x in a:
            counts[x] += 1
        out = []
        for value, c in enumerate(counts):
            out.extend([value] * c)
        return out

    print(counting_sort([2, 0, 2, 1], 2))
    ```
    What does this print?
