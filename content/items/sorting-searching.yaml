- id: binary-search-p1
  concept_id: binary-search
  kind: mcq
  stem: |-
    ```python
    def binary_search(a, target):
        lo, hi = 0, len(a) - 1
        while lo <= hi:
            mid = (lo + hi) // 2
            if a[mid] == target:
                return mid
            if a[mid] < target:
                lo = mid + 1
            else:
                hi = mid - 1
        return -1

    print(binary_search([9, 2, 7, 1, 5], 9))
    ```
