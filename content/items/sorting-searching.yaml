- id: bubble-sort-invariant-2
  concept_id: bubble-sort-invariant
  kind: mcq
  stem: 'Consider this concrete application of Bubble Sort Invariant:


    ```python

    for i in range(n): for j in range(n - i - 1): if arr[j] > arr[j+1]: swap()

    ```


    What is the fundamental guarantee demonstrated by this trace?'
  options:
  - Bubble sort swaps adjacent out-of-order elements across repeated passes.
  - It guarantees random O(1) jump access to any uncomputed state.
  - It eliminates the need for any base state or bounds.
  - It executes an infinite loop that ignores input constraints.
  answer: Bubble sort swaps adjacent out-of-order elements across repeated passes.
  difficulty: 2
