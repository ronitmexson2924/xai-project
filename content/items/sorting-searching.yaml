    It executes in reverse order without updating state.: binary-search-on-unsorted
  is_microcheck: false
  review_status: approved
- id: binary-search-bounds-2
  concept_id: binary-search-bounds
  kind: mcq
  stem: 'Consider this concrete application of Binary Search Bounds:


    ```python

    while low <= high: mid = (low + high) // 2

    ```


    What is the fundamental guarantee demonstrated by this trace?'
  options:
  - Binary search maintains low and high pointers enclosing the search space.
  - It guarantees random O(1) jump access to any uncomputed state.
  - It eliminates the need for any base state or bounds.
  - It executes an infinite loop that ignores input constraints.
  answer: Binary search maintains low and high pointers enclosing the search space.
  difficulty: 2
  distractor_misconceptions:
