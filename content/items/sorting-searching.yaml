- id: binary-search-bounds-1
  concept_id: binary-search-bounds
  kind: mcq
  stem: Which statement correctly characterizes the core invariant of Binary Search
    Bounds?
  options:
  - Update low = mid + 1 or high = mid - 1 to guarantee progress each iteration.
  - It operates without bounds and skips checking the termination condition.
  - It executes in reverse order without updating state.
  - It treats all elements as mutually independent without relationships.
  answer: Update low = mid + 1 or high = mid - 1 to guarantee progress each iteration.
  difficulty: 2
  distractor_misconceptions:
