- id: quick-sort-p3
  concept_id: quick-sort
  kind: mcq
  stem: |-
    ```python
    def quick_sort(a):
        if len(a) <= 1:
            return a
        pivot = a[len(a) // 2]
        less = [x for x in a if x < pivot]
        equal = [x for x in a if x == pivot]
        greater = [x for x in a if x > pivot]
        return quick_sort(less) + equal + quick_sort(greater)

    print(quick_sort([4, 1, 4, 2]))
    ```
    What does this print?
  options:
  - '[4, 4, 2, 1]'
  - '[1, 2, 4, 4]'
  - '[1, 2, 4]'
  answer: '[1, 2, 4, 4]'
  difficulty: 4
  distractor_misconceptions:
    '[1, 2, 4]': qs-always-nlogn
    '[4, 4, 2, 1]': qs-always-nlogn
  is_microcheck: false
  review_status: draft
