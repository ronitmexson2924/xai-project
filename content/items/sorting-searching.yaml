- id: linear-search-1
  concept_id: linear-search
  kind: mcq
  stem: Which statement correctly characterizes the core invariant of Linear Search?
  options:
  - Works on unsorted collections in O(N) worst-case time.
  - It operates without bounds and skips checking the termination condition.
  - It executes in reverse order without updating state.
  - It treats all elements as mutually independent without relationships.
  answer: Works on unsorted collections in O(N) worst-case time.
  difficulty: 1
  distractor_misconceptions:
    It operates without bounds and skips checking the termination condition.: linear-search-requires-sorted
    It executes in reverse order without updating state.: linear-search-requires-sorted
  is_microcheck: false
  review_status: approved
- id: linear-search-2
  concept_id: linear-search
  kind: mcq
  stem: 'Consider this concrete application of Linear Search:


    ```python

    for i, val in enumerate(arr): if val == target: return i

    ```


    What is the fundamental guarantee demonstrated by this trace?'
  options:
  - Linear search checks every element sequentially until target is found or list
    ends.
  - It guarantees random O(1) jump access to any uncomputed state.
  - It eliminates the need for any base state or bounds.
  - It executes an infinite loop that ignores input constraints.
  answer: Linear search checks every element sequentially until target is found or
    list ends.
  difficulty: 1
  distractor_misconceptions:
    It eliminates the need for any base state or bounds.: linear-search-requires-sorted
    It executes an infinite loop that ignores input constraints.: linear-search-requires-sorted
  is_microcheck: false
  review_status: approved
- id: linear-search-3
  concept_id: linear-search
  kind: mcq
  stem: When implementing Linear Search, which error represents the most frequent
