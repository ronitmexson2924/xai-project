- id: topological-sort-p3
  concept_id: topological-sort
  kind: mcq
  stem: |-
    ```python
    from collections import deque
    def topo_order(vertices, edges):
        indeg = {v: 0 for v in vertices}
        out = {v: [] for v in vertices}
        for u, v in edges:
            out[u].append(v)
            indeg[v] += 1
        q = deque(v for v in vertices if indeg[v] == 0)
        order = []
        while q:
            u = q.popleft()
            order.append(u)
            for v in out[u]:
                indeg[v] -= 1
                if indeg[v] == 0:
                    q.append(v)
        return order if len(order) == len(vertices) else None

    print(topo_order(["x", "y", "z"], [("x", "y"), ("y", "z"), ("z", "y")]))
    ```
    What does this print?
  options:
  - '[''x'']'
  - '[''x'', ''y'', ''z'']'
  - None
  answer: None
  difficulty: 4
  distractor_misconceptions:
    '[''x'', ''y'', ''z'']': topo-cycles-ok
    '[''x'']': topo-cycles-ok
  is_microcheck: false
  review_status: draft
