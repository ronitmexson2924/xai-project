- id: cycle-detection-directed-1
  concept_id: connected-components
  kind: mcq
  stem: Which statement correctly characterizes the core invariant of Cycle Detection
    in Directed Graphs?
  options:
  - A back-edge points to an ancestor node currently in the active DFS recursion stack.
  - It operates without bounds and skips checking the termination condition.
  - It executes in reverse order without updating state.
  - It treats all elements as mutually independent without relationships.
  answer: A back-edge points to an ancestor node currently in the active DFS recursion
    stack.
  difficulty: 4
