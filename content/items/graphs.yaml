- id: breadth-first-search-queue-1
  concept_id: graph-bfs
  kind: mcq
  stem: Which statement correctly characterizes the core invariant of Breadth-First
    Search (BFS)?
  options:
  - Guarantees finding shortest path in unweighted graphs.
