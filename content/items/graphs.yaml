- id: dijkstra-shortest-path-1
  concept_id: dijkstra-shortest-path
  kind: mcq
  stem: Which statement correctly characterizes the core invariant of Dijkstra's Algorithm?
  options:
  - Relaxation updates dist[v] = min(dist[v], dist[u] + weight(u, v)).
  - It operates without bounds and skips checking the termination condition.
  - It executes in reverse order without updating state.
  - It treats all elements as mutually independent without relationships.
  answer: Relaxation updates dist[v] = min(dist[v], dist[u] + weight(u, v)).
  difficulty: 4
  distractor_misconceptions:
    It operates without bounds and skips checking the termination condition.: dijkstra-handles-negative-weights
    It executes in reverse order without updating state.: dijkstra-handles-negative-weights
  is_microcheck: false
  review_status: approved
- id: dijkstra-shortest-path-2
  concept_id: dijkstra-shortest-path
  kind: mcq
  stem: 'Consider this concrete application of Dijkstra''s Algorithm:


    ```python

    heap = [(0, start)]; while heap: (d, u) = heappop(heap); if d > dist[u]: continue

    ```


    What is the fundamental guarantee demonstrated by this trace?'
  options:
  - Dijkstra greedily extracts vertex with minimum provisional distance from a priority
    queue.
  - It guarantees random O(1) jump access to any uncomputed state.
  - It eliminates the need for any base state or bounds.
  - It executes an infinite loop that ignores input constraints.
  answer: Dijkstra greedily extracts vertex with minimum provisional distance from
    a priority queue.
  difficulty: 4
  distractor_misconceptions:
    It eliminates the need for any base state or bounds.: dijkstra-handles-negative-weights
    It executes an infinite loop that ignores input constraints.: dijkstra-handles-negative-weights
  is_microcheck: false
  review_status: approved
