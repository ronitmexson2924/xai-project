- id: dijkstra-p2
  concept_id: dijkstra
  kind: mcq
  stem: |-
    ```python
    import heapq
    def dijkstra(adj, src):
        dist, done = {src: 0}, set()
        heap = [(0, src)]
        while heap:
            d, u = heapq.heappop(heap)
            if u in done:
                continue
            done.add(u)
            for v, w in adj.get(u, []):
                if v not in done and d + w < dist.get(v, float("inf")):
                    dist[v] = d + w
                    heapq.heappush(heap, (d + w, v))
        return dist

    adj = {"s": [("a", 1), ("b", 2)], "b": [("a", -5)]}
    print(dijkstra(adj, "s")["a"])
    ```
    This prints 1. What is the true shortest distance from s to a?
  options:
  - '1: Dijkstra''s answer is correct even with negative edges'
  - -3, via s -> b -> a; Dijkstra settled a before seeing the negative edge
  - '1: a negative edge can never make a path shorter'
  answer: -3, via s -> b -> a; Dijkstra settled a before seeing the negative edge
  difficulty: 4
  distractor_misconceptions:
    '1: Dijkstra''s answer is correct even with negative edges': dij-negative-weights
    '1: a negative edge can never make a path shorter': dij-negative-weights
  is_microcheck: false
  review_status: draft
