- id: topological-sort-1
  concept_id: topological-sort
  kind: mcq
  stem: Which statement correctly characterizes the core invariant of Topological
    Sorting (Kahn's Algorithm)?
  options:
  - Vertices with in-degree 0 have no unmet dependencies and can be processed first.
  - It operates without bounds and skips checking the termination condition.
  - It executes in reverse order without updating state.
  - It treats all elements as mutually independent without relationships.
  answer: Vertices with in-degree 0 have no unmet dependencies and can be processed
    first.
  difficulty: 4
  distractor_misconceptions:
    It operates without bounds and skips checking the termination condition.: topo-unique
    It executes in reverse order without updating state.: topo-cycles-ok
    It treats all elements as mutually independent without relationships.: topo-unique
  is_microcheck: false
  review_status: approved
- id: topological-sort-2
  concept_id: topological-sort
  kind: mcq
  stem: 'Consider this concrete application of Topological Sorting (Kahn''s Algorithm):


    ```python

    Calculate in_degrees; push 0-in-degree nodes to queue; decrement neighbors.

    ```


    What is the fundamental guarantee demonstrated by this trace?'
  options:
  - Topological sort orders vertices of a Directed Acyclic Graph (DAG) by dependency.
  - It guarantees random O(1) jump access to any uncomputed state.
  - It eliminates the need for any base state or bounds.
  - It executes an infinite loop that ignores input constraints.
  answer: Topological sort orders vertices of a Directed Acyclic Graph (DAG) by dependency.
  difficulty: 4
