- id: graph-adjacency-list-1
  concept_id: graph-adjacency-list
  kind: mcq
  stem: Which statement correctly characterizes the core invariant of Graph Adjacency
    List?
  options:
  - Space complexity is O(V + E), optimal for sparse graphs compared to O(V^2) matrix.
  - It operates without bounds and skips checking the termination condition.
  - It executes in reverse order without updating state.
  - It treats all elements as mutually independent without relationships.
  answer: Space complexity is O(V + E), optimal for sparse graphs compared to O(V^2)
    matrix.
  difficulty: 2
  distractor_misconceptions:
    It operates without bounds and skips checking the termination condition.: undirected-one-way-edge
    It executes in reverse order without updating state.: undirected-one-way-edge
  is_microcheck: false
  review_status: approved
- id: graph-adjacency-list-2
  concept_id: graph-adjacency-list
  kind: mcq
  stem: 'Consider this concrete application of Graph Adjacency List:


    ```python

    graph = {0: [1, 2], 1: [2], 2: []}

    ```


    What is the fundamental guarantee demonstrated by this trace?'
  options:
  - Adjacency list maps each vertex to a list of adjacent neighbor vertices.
  - It guarantees random O(1) jump access to any uncomputed state.
  - It eliminates the need for any base state or bounds.
  - It executes an infinite loop that ignores input constraints.
  answer: Adjacency list maps each vertex to a list of adjacent neighbor vertices.
  difficulty: 2
  distractor_misconceptions:
    It eliminates the need for any base state or bounds.: undirected-one-way-edge
    It executes an infinite loop that ignores input constraints.: undirected-one-way-edge
  is_microcheck: false
  review_status: approved
- id: graph-adjacency-list-3
  concept_id: graph-adjacency-list
  kind: mcq
  stem: When implementing Graph Adjacency List, which error represents the most frequent
    pitfall?
  options:
  - Forgetting to add both (u, v) and (v, u) for undirected graphs.
  - Using descriptive identifier names for local pointers.
  - Structuring code inside functions rather than flat scripts.
  - Checking preconditions before accessing boundary values.
  answer: Forgetting to add both (u, v) and (v, u) for undirected graphs.
  difficulty: 3
  distractor_misconceptions:
    Using descriptive identifier names for local pointers.: undirected-one-way-edge
    Checking preconditions before accessing boundary values.: undirected-one-way-edge
  is_microcheck: false
  review_status: approved
