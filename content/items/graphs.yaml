- id: depth-first-search-visited-1
  concept_id: graph-dfs
  kind: mcq
  stem: Which statement correctly characterizes the core invariant of Depth-First
    Search (DFS)?
  options:
  - A visited set is mandatory to prevent infinite loops in cyclic graphs.
  - It operates without bounds and skips checking the termination condition.
  - It executes in reverse order without updating state.
  - It treats all elements as mutually independent without relationships.
  answer: A visited set is mandatory to prevent infinite loops in cyclic graphs.
  difficulty: 3
  distractor_misconceptions:
    It operates without bounds and skips checking the termination condition.: dfs-no-visited
    It executes in reverse order without updating state.: dfs-no-visited
    It treats all elements as mutually independent without relationships.: dfs-no-visited
  is_microcheck: false
  review_status: approved
- id: depth-first-search-visited-2
  concept_id: graph-dfs
  kind: mcq
  stem: 'Consider this concrete application of Depth-First Search (DFS):


    ```python

    visited.add(u); for v in adj[u]: if v not in visited: dfs(v)

    ```


    What is the fundamental guarantee demonstrated by this trace?'
  options:
  - DFS explores as far along each branch as possible before backtracking.
  - It guarantees random O(1) jump access to any uncomputed state.
  - It eliminates the need for any base state or bounds.
  - It executes an infinite loop that ignores input constraints.
  answer: DFS explores as far along each branch as possible before backtracking.
  difficulty: 3
  distractor_misconceptions:
    It guarantees random O(1) jump access to any uncomputed state.: dfs-no-visited
    It eliminates the need for any base state or bounds.: dfs-no-visited
    It executes an infinite loop that ignores input constraints.: dfs-no-visited
  is_microcheck: false
  review_status: approved
