- id: breadth-first-search-queue-2
  concept_id: breadth-first-search-queue
  kind: mcq
  stem: 'Consider this concrete application of Breadth-First Search (BFS):


    ```python

    queue = deque([start]); visited.add(start); while queue: u = popleft()

    ```


    What is the fundamental guarantee demonstrated by this trace?'
  options:
  - BFS explores vertices in order of increasing distance from source using a FIFO
    queue.
  - It guarantees random O(1) jump access to any uncomputed state.
  - It eliminates the need for any base state or bounds.
  - It executes an infinite loop that ignores input constraints.
  answer: BFS explores vertices in order of increasing distance from source using
    a FIFO queue.
  difficulty: 3
  distractor_misconceptions:
    It eliminates the need for any base state or bounds.: bfs-mark-visited-on-pop
    It executes an infinite loop that ignores input constraints.: bfs-shortest-path-weighted
  is_microcheck: false
  review_status: approved
