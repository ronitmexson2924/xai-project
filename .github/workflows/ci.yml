name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pcg
          POSTGRES_PASSWORD: pcg
          POSTGRES_DB: pcg_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pcg" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://pcg:pcg@localhost:5432/pcg_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  frontend:
    # Steps are skipped until Mit's M0 creates frontend/package.json.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: hashFiles('frontend/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: npm ci && npm run lint && npm run build

  e2e:
    # Browser tests against the real stack: Postgres, the API and the production frontend.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pcg
          POSTGRES_PASSWORD: pcg
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pcg" --health-interval 5s --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: backend
        run: pip install -e ".[dev]"
      - working-directory: frontend
        run: npm ci && npm run build && npx playwright install --with-deps chromium
      - working-directory: frontend
        env:
          PYTHON: python
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results

  compose:
    # `docker compose up --build` is the documented one-command start: keep it working.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --detach --wait --wait-timeout 300
      - name: The API and the frontend answer, and the demo accounts exist
        run: |
          curl -fsS http://localhost:8000/health/ready
          curl -fsS -o /dev/null http://localhost:3000/
          curl -fsS -X POST http://localhost:8000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"chen@demo.example.com","password":"Demo-pass-1"}' -o /dev/null
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
