name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pcg
          POSTGRES_PASSWORD: pcg
          POSTGRES_DB: pcg_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pcg" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://pcg:pcg@localhost:5432/pcg_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run lint && npx tsc --noEmit && npm run build

  e2e:
    # The real stack: Postgres, the API with migrated and seeded content, the built frontend,
    # and a browser acting as learners (and as people trying to break it).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pcg
          POSTGRES_PASSWORD: pcg
          POSTGRES_DB: pcg_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pcg" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://pcg:pcg@localhost:5432/pcg_e2e
      E2E_DATABASE_URL: postgresql+psycopg://pcg:pcg@localhost:5432/pcg_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: backend
        run: pip install -e . && alembic upgrade head && python -m app.graph.seed ../content
      - working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium && npm run build
      - working-directory: frontend
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results
