# Remap of the IDs in Mit's item bank draft (origin/mit, M5) onto the real concept graph
# (content/concepts.yaml) and misconception catalogue (content/misconceptions.yaml).
#
# Why: the M5 items were generated from app/items/curriculum.py, a parallel curriculum with its own
# IDs. Against the real graph, 172 concept references and 380 misconception references are unknown,
# so seeding fails and almost every DB test errors once mit is merged into dev.
#
# Every target ID below exists on dev (the 22 misconceptions that had no counterpart were added to
# content/misconceptions.yaml). Several Mit concepts fold into one real concept; that is intended.
# Applying this file fixes the IDs only. It does not fix item quality: see the issue that links here.

