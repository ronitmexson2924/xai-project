[project]
name = "pcg-engine"
version = "0.1.0"
description = "Psychometric Concept-Graph Explanation-Feedback Engine (backend)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "google-genai>=1.0",
  "bcrypt>=4.0",
  "pyjwt>=2.8",
  "email-validator>=2.0",
  "jinja2>=3.1",
  # the performance model and its explanations (app/ml): training, SHAP, LIME
  "scikit-learn>=1.5",
  "shap>=0.46",
  "lime>=0.2.0.1",
  # shared rate-limit counters when REDIS_URL is set (app/auth/limits.py)
  "redis>=5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.6",
  "pandas>=2.2",
  "statsmodels>=0.14",
  "fakeredis>=2.23",
]
research = ["matplotlib>=3.8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../research"]  # research/simulator is smoke-tested from tests/

[tool.ruff.lint.isort]
known-third-party = ["alembic"]  # the local alembic/ migrations folder is not the package
known-first-party = ["app", "simulator"]  # simulator lives in ../research
